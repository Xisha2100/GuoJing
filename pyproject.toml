[project]
name = "guojing"
version = "0.1.0"
description = "Backend API for 老牌子, an in-context smartphone guidance assistant."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
]

[build-system]
requires = ["hatchling>=1.31.0,<2.0.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.7.0,<3.0.0",
    "mypy>=2.3.0,<2.4.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.15.22,<0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guojing"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
